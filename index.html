<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>LAG Logo Title</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #eee;
            font-family: sans-serif;
        }
        canvas {
            border: 1px solid #444;
            background-color: #000;
        }
        #controls {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 14px;
            padding: 10px 14px;
            border: 1px solid #444;
            background: #222;
            border-radius: 6px;
        }
        button, input {
            accent-color: #00c8ff;
        }
        button {
            padding: 6px 12px;
            color: #eee;
            background: #333;
            border: 1px solid #666;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #444;
        }
        label {
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>
    <canvas id="glCanvas" width="800" height="600"></canvas>
    <div id="controls" aria-label="Animation controls">
        <button id="playPause" type="button">Pause</button>
        <button id="reset" type="button">Reset</button>
        <label>
            Animation
            <select id="animationType">
                <option value="spin">Spin</option>
                <option value="rotate">Rotate</option>
                <option value="float">Float</option>
                <option value="orbit">Orbit</option>
                <option value="pulse">Pulse</option>
            </select>
        </label>
        <label>
            Speed
            <input id="speed" type="range" min="0.25" max="2" step="0.25" value="1" />
            <span id="speedValue">1x</span>
        </label>
        <button id="direction" type="button">Direction: Right</button>
    </div>
    <div class="logoControls">
        <label>
            Extrusion Depth: 
            <label>
                Thin
                <input type="range" min="0.1" max="1.0" value="0.2" step="0.1" id="extDepth" class="slider">
                Thick&emsp;
            </label>
            Colour: 
            <input type="color" id="logoCol">
        </label>
    </div>
    <script src="extrusion.js"></script>
    <script src="main.js"></script>
</body>
</html>
